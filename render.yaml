services:
  # Unified Service - Serves both API and Frontend
  - type: web
    name: growwise
    env: node
    plan: free
    buildCommand: npm run install:all && npm run build:frontend
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://growwise-p20f.onrender.com # This should match your actual Render URL
      - key: DATABASE_URL
        fromDatabase:
          name: household-budget-db
          property: connectionString
      # Add other env vars manually in Render dashboard
